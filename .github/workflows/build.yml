# Builds and tests everything on GitHub's machines, which can reach Google Maven.
# The debug APK is attached to each run as the "melkcrm-debug-apk" artifact; builds of main also put it,
# with the generated Room schema, on the "apk" branch so it can be fetched with plain git.
name: Build

on:
  push:
    branches-ignore: [ci-logs, apk]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jvm:
    name: Core, client and backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:test :client:test :backend:test --console=plain
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: jvm-test-reports
          path: "*/build/reports/tests/"

  android:
    name: Android app
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only for publishing to the apk and ci-logs branches
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Debug APK
        working-directory: android
        shell: bash
        run: ./gradlew :app:assembleDebug --console=plain 2>&1 | tee ../assemble.log
      - uses: actions/upload-artifact@v4
        with:
          name: melkcrm-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Unit tests (Robolectric, Room)
        working-directory: android
        shell: bash
        run: ./gradlew :app:testDebugUnitTest --console=plain 2>&1 | tee ../unit-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: room-schema
          path: android/app/schemas/
          if-no-files-found: ignore
      - name: Publish APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          mkdir -p /tmp/apk
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/apk/melkcrm-debug.apk
          cp -r android/app/schemas /tmp/apk/schemas
          cd /tmp/apk
          git init -q -b apk
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Debug APK of ${{ github.sha }} (run ${{ github.run_id }})"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk
      # Release build without a keystore (unsigned): checks that R8 shrinking and the keep rules go through.
      - name: Release build (R8)
        working-directory: android
        shell: bash
        run: ./gradlew :app:assembleRelease --console=plain 2>&1 | tee ../assemble-release.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-reports
          path: android/app/build/reports/
      # Full Gradle output on a branch of its own, readable with plain git when log downloads are not possible.
      - name: Publish build logs
        if: failure()
        shell: bash
        run: |
          mkdir -p /tmp/ci-logs
          cp ./*.log /tmp/ci-logs/ 2>/dev/null || true
          find android/app/build/test-results -name '*.xml' -exec cp {} /tmp/ci-logs/ \; 2>/dev/null || true
          cd /tmp/ci-logs
          git init -q -b ci-logs
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Build logs of run ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs
